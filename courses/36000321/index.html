    <h2 id="materials-title">课程课件</h2>
    <p id="materials-status" role="status" aria-live="polite">可通过下方链接查看课件目录。</p>
    <ul id="materials-list"></ul>
    <p><a href="https://github.com/sjrGCkym/sjrGCkym.github.io/tree/master/courses/36000321" target="_blank" rel="noopener noreferrer">查看课件目录</a></p>

  </section>
  <details>
    <summary>教师：上传/维护课件</summary>
    <p>登录 GitHub 后，点击<a href="https://github.com/sjrGCkym/sjrGCkym.github.io/upload/master/courses/36000321" target="_blank" rel="noopener noreferrer">上传课件</a>，选择 PPT、PPTX 或 PDF 文件，再点击 Commit changes 提交。发布完成后，课件会自动出现在本页。</p>
    <p>建议按章节命名，例如“01-课程介绍.pptx”，列表按文件名排序。更新同名文件时，重新上传并提交即可。</p>
  </details>
  <script>
  (async () => {
    const status = window.document.getElementById('materials-status');
    const list = window.document.getElementById('materials-list');
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    status.textContent = '正在加载课件列表…';
    try {
      const response = await fetch('https://api.github.com/repos/sjrGCkym/sjrGCkym.github.io/contents/courses/36000321?ref=master', {
        headers: { Accept: 'application/vnd.github+json' },
        signal: controller.signal
      });
      if (!response.ok) throw new Error('Unable to load materials');
      const entries = await response.json();
      if (!Array.isArray(entries)) throw new Error('Unexpected response');
      const files = entries.filter(file => file.type === 'file' && /\.(pptx?|pdf)$/i.test(file.name));
      files.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));
      for (const file of files) {
        const item = window.document.createElement('li');
        const link = window.document.createElement('a');
        link.href = './' + encodeURIComponent(file.name);
        link.textContent = file.name;
        link.setAttribute('download', file.name);
        item.appendChild(link);
        list.appendChild(item);
      }
      status.textContent = files.length ? '点击文件名下载课件。' : '课件尚未上传。';
    } catch {
      status.textContent = '课件列表暂时无法加载，请通过“查看课件目录”访问资料。';
    } finally {
      clearTimeout(timeout);
    }
  })();
  </script>
